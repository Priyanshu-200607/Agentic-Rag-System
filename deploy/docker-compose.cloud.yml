version: '3.8'

# Enterprise AWS Cloud Deployment Stack (Phase 3 Foundation)
services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.multistage
    ports:
      - "8000:8000"
    environment:
      - APP_EDITION=enterprise
      - DEPLOYMENT_TYPE=cloud
      - STORAGE_BACKEND=s3
      - STATE_BACKEND=postgres
      - VECTOR_BACKEND=qdrant
      - INFERENCE_BACKEND=vllm
    restart: always

  # Redis Task Queue for Background Ingestion
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Distributed Vector DB
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
