services:
  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - OLLAMA_HOST=http://ollama:11434
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      # Preserve the container's embedded model even if it's missing on the host
      - /app/embedding_model
      - ./frontend:/frontend
    depends_on:
      - ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama_data:
